# heliu 项目注册表：磁吸背夹（三仓库）
# 正本位置：~/Library/Application Support/heliu/projects/磁吸背夹/project.yaml
# 主线/集成分支均于 2026-10-26 只读核实（symbolic-ref、branch --list、merge-base）。
name: 磁吸背夹
# 台账（功能卡 + 里程碑）放在 heliu 自己的数据目录：M2 起不往磁吸背夹三个仓库写任何文件。
# 缺省是 <主仓库>/.heliu/（主仓库 = primary 或第一个仓库）。
ledger: ~/Library/Application Support/heliu/projects/磁吸背夹/ledger
# M4：合并时按 union 处理的索引文件（两边都保留、新日期在前；10-22 集成方案里三处冲突都在这三个文件）。
# 路径相对仓库根，对项目内所有仓库生效（固件仓 README.md 若冲突也按 union 处理）。union_sort_by_date: false 可关闭排序。
union_files:
  - README.md
  - 嵌入式/README.md
  - 业务/AI-Coding业务与进度.md
# M4：合并后在临时 worktree 里跑的检查（可空）。文档仓没有测试，暂不配置。
# checks: []
repos:
  - id: docs
    label: 文档仓
    path: /Users/linxiansheng/Library/Mobile Documents/com~apple~CloudDocs/磁吸背夹
    main: main
    integration: claude/merge-features-refactor-143693
    remote: github
    icloud: true
  - id: firmware
    label: 固件仓
    path: /Users/linxiansheng/.cache/backclip-web/esp_claw
    # 产品主线是 release/backclip-1.1（本地 main 是上游 ESP-Claw 的 main）；1.1 是 feat/aios-entry 的祖先（0/100）
    main: release/backclip-1.1
    integration: feat/aios-entry
    # github=janauto（release/backclip-1.0 的上游所在），origin=公司 GitLab；1.1 目前两边都没有
    remote: github
    icloud: false
  - id: app
    label: App 仓
    path: /Users/linxiansheng/.cache/backclip-app-gitlab-20261015
    # HEAD 与唯一的发布分支；上游 github/release/backclip-1.0
    main: release/backclip-1.0
    remote: github
